name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Upgrade pip
        run: python -m pip install -U pip

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests tools

      # Live tests are opt-in (THIRTYCLI_LIVE=1 plus a provider key). CI never sets
      # THIRTYCLI_LIVE, so they skip here; the marker filter keeps it explicit.
      - name: Test
        run: pytest -q -m "not live"
